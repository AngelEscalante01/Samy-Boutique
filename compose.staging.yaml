name: samy-vps-qa
x-app:
  image: samy-vps-qa:20261101
  build: &id001
    context: .
    dockerfile: docker/local/Dockerfile
    args:
      VITE_PRODUCT_IMAGES_URL: ${R2_PUBLIC_URL:?isolated test bucket required}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
  init: true
  restart: unless-stopped
  entrypoint: &id002
  - sh
  - /qa/entrypoint.sh
  networks: &id003
  - application
  - egress
  env_file: &id004
  - ./.env.staging.private
  - ./.env.r2-test.private
  - ./.env.firebase-dev.private
  environment: &id005
    SAMY_QA_ONLY: '1'
    APP_NAME: Samy VPS Pruebas
    APP_ENV: staging
    APP_DEBUG: 'false'
    APP_URL: http://127.0.0.1:18180
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: '3306'
    DB_DATABASE: samy_vps_qa
    DB_USERNAME: samy_qa
    DB_COLLATION: utf8mb4_unicode_ci
    SESSION_DRIVER: database
    SESSION_COOKIE: samy_vps_qa_session
    SESSION_SECURE_COOKIE: 'false'
    CACHE_STORE: database
    CACHE_PREFIX: samy_vps_qa
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'
    MAIL_FROM_ADDRESS: no-reply@samy.test
    PRODUCT_IMAGES_DISK: r2_public
    CAROUSEL_IMAGES_DISK: r2_public
    CUSTOMER_PHOTOS_DISK: r2_private
    MEDIA_MIGRATION_ENABLED: 'false'
    SAMY_DELETE_IMAGES_ON_SALE: 'false'
    NOTIFICATIONS_PUSH_ENABLED: 'false'
    NOTIFICATIONS_LAYAWAY_SCAN_ENABLED: 'false'
    APP_TIMEZONE: America/Mexico_City
    TICKET_TIMEZONE: America/Mexico_City
    FIREBASE_CREDENTIALS: /run/secrets/firebase-dev.json
    FIREBASE_PROJECT_ID: samy-boutique-dev
  volumes: &id006
  - qa-storage:/app/storage
  - ./docker/staging:/qa:ro
  - ./firebase-dev-service-account.json:/run/secrets/firebase-dev.json:ro
  depends_on: &id007
    mysql:
      condition: service_healthy
    mailpit:
      condition: service_started
  mem_limit: 384m
  labels:
    traefik.enable: 'false'
services:
  web:
    image: samy-vps-qa:20261101
    build: *id001
    init: true
    restart: unless-stopped
    entrypoint: *id002
    networks: *id003
    env_file: *id004
    environment: *id005
    volumes: *id006
    depends_on: *id007
    mem_limit: 384m
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - 'exit(@file_get_contents(''http://localhost:8000/up'') === false ? 1 : 0);'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
    - php
    - artisan
    - serve
    - --host=0.0.0.0
    - --port=8000
    labels:
      traefik.enable: 'false'
  worker:
    image: samy-vps-qa:20261101
    build: *id001
    init: true
    restart: unless-stopped
    entrypoint: *id002
    networks: *id003
    env_file: *id004
    environment: *id005
    volumes: *id006
    depends_on: *id007
    mem_limit: 384m
    command:
    - php
    - artisan
    - queue:work
    - database
    - --queue=default,catalog-imports,sale-notifications
    - --sleep=3
    - --tries=3
    - --timeout=60
    stop_grace_period: 75s
    labels:
      traefik.enable: 'false'
  scheduler:
    image: samy-vps-qa:20261101
    build: *id001
    init: true
    restart: unless-stopped
    entrypoint: *id002
    networks: *id003
    env_file: *id004
    environment: *id005
    volumes: *id006
    depends_on: *id007
    mem_limit: 384m
    command:
    - php
    - artisan
    - schedule:work
    labels:
      traefik.enable: 'false'
  gateway:
    image: nginx:1.27-alpine
    networks:
    - application
    - access
    ports:
    - 127.0.0.1:18180:80
    volumes:
    - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 64m
    labels:
      traefik.enable: 'false'
  mysql:
    image: mariadb:10.6.28
    networks:
    - application
    environment:
      MARIADB_DATABASE: samy_vps_qa
      MARIADB_USER: samy_qa
      MARIADB_PASSWORD: ${DB_PASSWORD:?private environment required}
      MARIADB_ROOT_PASSWORD: ${QA_DB_ROOT_PASSWORD:?private environment required}
    volumes:
    - qa-database:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MARIADB_PASSWORD}" mariadb -h 127.0.0.1 -u samy_qa -D samy_vps_qa
        -e "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    labels:
      traefik.enable: 'false'
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    networks:
    - application
    mem_limit: 128m
    labels:
      traefik.enable: 'false'
networks:
  application:
    internal: true
  access: {}
  egress: {}
volumes:
  qa-storage: {}
  qa-database: {}
