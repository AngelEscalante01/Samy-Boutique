name: samy-sandbox

x-app: &app
  image: samy-sandbox-app:local
  build:
    context: .
    dockerfile: docker/local/Dockerfile
    args:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
  init: true
  restart: unless-stopped
  networks: [sandbox]
  environment: &environment
    APP_NAME: Samy Local
    APP_ENV: local
    APP_DEBUG: "true"
    APP_KEY: base64:bG9jYWwtb25seS1zYW15LWtleS0zMi1ieXRlcyEhISE=
    APP_URL: http://localhost:18080
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: samy_local
    DB_COLLATION: utf8mb4_unicode_ci
    DB_USERNAME: samy_local
    DB_PASSWORD: local-only-samy-password
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    MAIL_ENCRYPTION: "null"
    MAIL_FROM_ADDRESS: local@samy.test
    LOG_CHANNEL: stderr
    FILESYSTEM_DISK: local
    PRODUCT_IMAGES_DISK: r2_public
    CAROUSEL_IMAGES_DISK: r2_public
    CUSTOMER_PHOTOS_DISK: r2_private
    BRAND_LOGO_DISK: r2_public
    BRAND_LOGO_PATH: samy/brand/logo/23d553ea436f70b79f33bd259c76014f3f73f265d8367123c5819045c12f88f9.png
    R2_ACCESS_KEY_ID: samy-local
    R2_SECRET_ACCESS_KEY: samy-local-minio-password
    R2_REGION: us-east-1
    R2_ENDPOINT: http://minio:9000
    R2_USE_PATH_STYLE_ENDPOINT: "true"
    R2_PUBLIC_BUCKET: samy-public-local
    R2_PRIVATE_BUCKET: samy-private-local
    R2_PUBLIC_URL: http://localhost:19000/samy-public-local
    MEDIA_MIGRATION_ENABLED: "false"
    NOTIFICATIONS_PUSH_ENABLED: "false"
    NOTIFICATIONS_LAYAWAY_SCAN_ENABLED: "false"
    FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
    VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
    VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
    VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
    VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
  volumes:
    - app-storage:/app/storage
  depends_on:
    mysql: {condition: service_healthy}
    mailpit: {condition: service_started}
    buckets: {condition: service_completed_successfully}

services:
  web:
    <<: *app
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  gateway:
    image: nginx:1.27-alpine
    networks: [sandbox, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_healthy}
  queue-default:
    <<: *app
    command: [php, artisan, 'queue:work', database, '--queue=default,catalog-imports', '--sleep=3', '--tries=3', '--timeout=60']
    stop_grace_period: 75s
  queue-sales:
    <<: *app
    command: [php, artisan, 'queue:work', sale_notifications, '--queue=sale-notifications', '--sleep=3', '--tries=3', '--timeout=60']
    stop_grace_period: 75s
  scheduler:
    <<: *app
    command: [php, artisan, 'schedule:work']
  mysql:
    image: mariadb:10.6.28
    networks: [sandbox]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: samy_local
      MARIADB_USER: samy_local
      MARIADB_PASSWORD: local-only-samy-password
      MARIADB_ROOT_PASSWORD: local-only-root-password
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MARIADB_PASSWORD}" mariadb -h 127.0.0.1 -u samy_local -D samy_local -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    networks: [sandbox, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:18025:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mail-data:/data]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-18T21-56-31Z
    networks: [sandbox, edge]
    restart: unless-stopped
    command: [server, /data, '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: samy-local
      MINIO_ROOT_PASSWORD: samy-local-minio-password
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
  buckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks: [sandbox]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        mc alias set local http://minio:9000 samy-local samy-local-minio-password;
        mc mb --ignore-existing local/samy-public-local;
        mc mb --ignore-existing local/samy-private-local;
        mc anonymous set download local/samy-public-local;
        mc anonymous set none local/samy-private-local

networks:
  sandbox:
    internal: true
    ipam:
      config:
        - subnet: 10.254.254.0/28
  edge:
    ipam:
      config:
        - subnet: 10.254.254.16/28
volumes:
  app-storage:
  mysql-data:
  mail-data:
  minio-data:
