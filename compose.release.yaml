name: ${SAMY_COMPOSE_PROJECT:-samy-release}
x-app: &app
  image: samy-release-app:${SAMY_RELEASE_TAG:-20261101}
  build:
    context: .
    dockerfile: docker/release/Dockerfile
    target: app
    args: &assets
      VITE_PRODUCT_IMAGES_URL: ${R2_PUBLIC_URL:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
  env_file: ${SAMY_RELEASE_ENV_FILE:-.env.release.private}
  volumes:
    - storage:/app/storage
    - ./release-state:/release-state:ro
    - ./firebase-prod-service-account.json:/run/secrets/firebase.json:ro
  networks: [application, egress]
  init: true
  restart: unless-stopped
  mem_limit: 512m
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  labels: {traefik.enable: 'false'}
  depends_on:
    mysql: {condition: service_healthy}
services:
  app:
    <<: *app
  worker:
    <<: *app
    restart: always
    profiles: [live]
    command: [php, artisan, 'queue:work', database, '--queue=default,catalog-imports,sale-notifications', '--sleep=3', '--tries=3', '--timeout=60']
    stop_grace_period: 75s
  scheduler:
    <<: *app
    restart: always
    profiles: [live]
    command: [php, artisan, 'schedule:work']
  push_worker:
    <<: *app
    restart: always
    profiles: [live]
    command: [php, artisan, 'queue:work', database, '--queue=push-notifications', '--sleep=3', '--tries=1', '--timeout=600']
    stop_grace_period: 615s
    mem_limit: 256m
  gateway:
    image: samy-release-gateway:${SAMY_RELEASE_TAG:-20261101}
    build:
      context: .
      dockerfile: docker/release/Dockerfile
      target: gateway
      args: *assets
    networks: [application, access]
    ports: ['127.0.0.1:${SAMY_LOOPBACK_PORT:-18181}:80']
    volumes: [storage:/app/storage:ro]
    restart: unless-stopped
    mem_limit: 64m
    labels: {traefik.enable: 'false'}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    depends_on: [app]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/up || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  mysql:
    image: mariadb:10.6.28
    networks: [application]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?database required}
      MARIADB_USER: ${DB_USERNAME:?user required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?private password required}
      MARIADB_ROOT_PASSWORD: ${RELEASE_DB_ROOT_PASSWORD:?private root password required}
    volumes: [database:/var/lib/mysql]
    restart: unless-stopped
    mem_limit: 512m
    labels: {traefik.enable: 'false'}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MARIADB_PASSWORD}" mariadb -h 127.0.0.1 -u "$${MARIADB_USER}" -D "$${MARIADB_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
networks:
  application: {internal: true}
  access: {}
  egress: {}
volumes:
  storage: {}
  database: {}
