<!doctype html>
<html lang="es">
<head>

    <meta name="robots" content="noindex,nofollow">
    <title>Sin conexión — Samy Boutique</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafaf9; color: #18181b; font-family: system-ui, sans-serif; }
        main { width: min(100%, 480px); padding: 40px 32px; border: 1px solid #e7e5e4; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 8px 24px #0000000a; }
        h1 { margin: 0 0 16px; font-size: 30px; }
        p { margin: 0 0 28px; color: #57534e; line-height: 1.5; }
        a { display: inline-block; padding: 12px 24px; border-radius: 12px; background: #18181b; color: #fff; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>Conéctate de nuevo para cargar Samy Boutique.</p>
        <a href="">Reintentar</a>
