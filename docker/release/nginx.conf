map $http_x_forwarded_proto $samy_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name samyboutique.com.mx www.samyboutique.com.mx sistema.samyboutique.com.mx;
    root /app/public;
    index index.php;
    server_tokens off;
    client_max_body_size 24m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /robots.txt { try_files /nonexistent-robots-file /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $samy_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        set $samy_fpm app:9000;
        fastcgi_pass $samy_fpm;
        fastcgi_read_timeout 75s;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location /build/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /storage/ { try_files $uri =404; }
}
